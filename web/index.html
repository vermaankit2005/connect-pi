<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>pi</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="theme-color" content="#000000" id="themeColor" />
<meta name="color-scheme" content="dark light" />
<script>
// Runs before the first paint, on purpose: reading the saved theme in app.js
// would show a flash of the wrong colour on every launch. "system" writes no
// attribute at all and lets the CSS media query decide.
(function () {
	try {
		var size = Number(localStorage.getItem("connect-pi.textSize"));
        var version = localStorage.getItem("connect-pi.scaleVersion");
        var sizes = [13.44, 14.4, 15.36, 16.32, 17.28];
        var previous = version === "3" ? [13.16, 14.1, 15.04, 15.98, 16.92] : version === "2" ? [12.5, 13.5, 14.5, 15.5, 16.5] : [14, 15, 16, 17, 18];
        var index = previous.indexOf(size);
        if (version !== "4" && index !== -1) size = sizes[index];
        if (sizes.indexOf(size) !== -1) document.documentElement.style.fontSize = size + "px";
        var t = localStorage.getItem("connect-pi.theme");
		if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
	} catch (e) {}
})();
</script>
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<link rel="manifest" href="/manifest.webmanifest" />

<!-- ------------------------------------------------------------ offline -->
<!-- Shown when the bridge cannot be reached at all. This is a different
     situation from "locked", and conflating the two used to produce the
     nonsense message "no passcode is set on the PC". -->
<section id="offline" class="screen offline hidden">
  <div class="offline-inner">
    <div class="offline-art">
      <span class="ring r1"></span>
      <span class="ring r2"></span>
      <svg class="ic"><use href="#i-unlink"/></svg>
    </div>

    <h1 class="offline-title">Can't reach your PC</h1>
    <p class="offline-sub" id="offlineSub">This app only works over Tailscale.</p>

    <ol class="offline-steps">
      <li><span class="n">1</span><span>Open <b>Tailscale</b> on this phone and switch it on</span></li>
      <li><span class="n">2</span><span>Make sure the PC is awake</span></li>
      <li><span class="n">3</span><span>Click <b>Start pi on phone</b> on the PC desktop</span></li>
    </ol>

    <button class="btn-primary offline-retry" id="offlineRetry">
      <svg class="ic ic-20"><use href="#i-refresh"/></svg><span>Try again</span>
    </button>

    <div class="offline-status" id="offlineStatus"></div>
    <div class="offline-host" id="offlineHost"></div>
  </div>
</section>

<!-- ------------------------------------------------------------ lock -->
<section id="lock" class="screen lock hidden">
  <div class="lock-inner">
    <div class="lock-mark">pi</div>
    <h1 class="lock-title">Locked</h1>
    <p class="lock-sub" id="lockSub">Unlock to reach your PC</p>

    <button class="finger-btn hidden" id="fingerBtn" type="button">
      <svg class="ic ic-28"><use href="#i-finger"/></svg>
      <span>Unlock with fingerprint</span>
    </button>

    <div class="pin hidden" id="pinArea">
      <div class="pin-dots" id="pinDots"></div>
      <div class="keypad" id="keypad"></div>
    </div>

    <div class="lock-error" id="lockError"></div>
    <button class="link-btn hidden" id="usePasscode" type="button">Use passcode instead</button>
  </div>
</section>

<!-- ------------------------------------------------------------ chat -->
<section id="chat" class="screen hidden">
  <header class="topbar">
    <button class="icon-circle" id="btnMenu" aria-label="Sessions" aria-expanded="false" aria-controls="drawer"><svg class="ic"><use href="#i-menu"/></svg></button>
    <button class="title-chip" id="btnTitle">
      <span id="topTitle">pi</span>
      <svg class="ic ic-16"><use href="#i-caret"/></svg>
    </button>
    <div class="icon-pill">
      <button id="btnNew" aria-label="New session"><svg class="ic"><use href="#i-compose"/></svg></button>
      <button id="btnMore" aria-label="More"><svg class="ic"><use href="#i-kebab"/></svg></button>
    </div>
  </header>

  <div class="conn-banner hidden" id="connBanner">
    <span class="conn-pulse"></span><span>Reconnecting to your PC</span>
  </div>

  <div class="thread" id="thread">
    <div id="messages"></div>
    <div class="thread-tail"></div>
  </div>

  <button class="jump hidden" id="btnJump" aria-label="Scroll to bottom"><svg class="ic"><use href="#i-down"/></svg></button>

  <div class="composer">
    <div class="composer-box">
      <button class="round-ghost" id="btnPlus" aria-label="More actions" aria-expanded="false"><svg class="ic"><use href="#i-plus"/></svg></button>
      <textarea id="input" rows="1" aria-label="Message" placeholder="Message pi" enterkeyhint="enter" autocomplete="off" autocapitalize="sentences"></textarea>
      <button class="round-ghost hidden" id="btnMic" aria-label="Dictate message"><svg class="ic"><use href="#i-mic"/></svg></button>
      <button class="round-send" id="btnSend" aria-label="Send"><svg class="ic"><use href="#i-up"/></svg></button>
    </div>
  </div>
</section>

<!-- ------------------------------------------------------------ drawer -->
<div class="scrim hidden" id="scrim"></div>
<aside class="drawer hidden" id="drawer" role="dialog" aria-modal="true" aria-label="Chat history">
  <div class="drawer-scroll" id="drawerScroll">
  <div class="drawer-head">
    <span class="drawer-brand">pi</span>
    <button class="icon-circle" id="drawerSearchToggle" aria-label="Search chats" aria-expanded="false"><svg class="ic"><use href="#i-search"/></svg></button>
  </div>
  <div class="drawer-search hidden" id="drawerSearchBox">
    <svg class="ic ic-18"><use href="#i-search"/></svg>
    <input id="drawerSearch" placeholder="Search chats and projects" aria-label="Search chats and projects" autocomplete="off" />
  </div>
  <nav class="drawer-nav" aria-label="Navigation">
    <button class="drawer-row" id="drawerCompose"><svg class="ic"><use href="#i-compose"/></svg><span>New chat</span></button>
    <button class="drawer-row" id="drawerLibrary" aria-label="All chats"><svg class="ic"><use href="#i-library"/></svg><span>Library</span></button>
    <button class="drawer-row" id="drawerCustomize"><svg class="ic"><use href="#i-customize"/></svg><span>Customize</span></button>
    <button class="drawer-row" id="drawerProjects"><svg class="ic"><use href="#i-folder"/></svg><span>Projects</span><svg class="ic ic-16 nav-chevron"><use href="#i-chevron"/></svg></button>
    <button class="drawer-row" id="drawerRunning"><svg class="ic"><use href="#i-terminal"/></svg><span>Running now</span></button>
    <button class="drawer-row" id="drawerBrowse"><svg class="ic"><use href="#i-newfolder"/></svg><span>Browse folders</span></button>
  </nav>
  <div class="drawer-list" id="drawerList"></div>
  </div>
  <div class="drawer-bottom">
    <button class="drawer-chat" id="drawerNew"><svg class="ic"><use href="#i-compose"/></svg><span>Chat</span></button>
    <button class="drawer-account" id="drawerSettings" aria-label="Settings"><span class="avatar">AV</span></button>
  </div>
</aside>

<div class="actions-wrap hidden" id="actionsWrap">
  <button class="actions-scrim" id="actionsScrim" aria-label="Close actions"></button>
  <div class="actions-menu" id="actionsMenu" role="dialog" aria-label="Chat actions"></div>
</div>

<!-- ------------------------------------------------------------ folders -->
<section id="picker" class="screen hidden">
  <header class="topbar topbar-plain">
    <button class="icon-circle" id="pickBack" aria-label="Back"><svg class="ic"><use href="#i-back"/></svg></button>
    <div class="pick-head">
      <div class="pick-title">Choose a folder</div>
      <div class="pick-path" id="pickPath"></div>
    </div>
  </header>
  <div class="pick-list" id="pickList"></div>
  <div class="pick-actions">
    <button class="btn-ghost" id="pickNewFolder"><svg class="ic ic-20"><use href="#i-newfolder"/></svg><span>New folder</span></button>
    <button class="btn-primary" id="pickStart" disabled>Start pi here</button>
  </div>
</section>

<!-- ------------------------------------------------------------ overlays -->
<div class="sheet-wrap hidden" id="sheetWrap">
  <div class="sheet-scrim" id="sheetScrim"></div>
  <div class="sheet" id="sheet"></div>
</div>

<div class="dialog-wrap hidden" id="dialogWrap">
  <div class="dialog" id="dialog"></div>
</div>

<div class="toast hidden" id="toast"></div>

<script type="module" src="/app.js"></script>
</body>
</html>
